<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ENEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <!-- MENU INICIAL (aparece primeiro) -->
        <div id="menu-container">
            <h1>Escolha seu treino</h1>
            <p class="subtitulo">Selecione o que você quer focar hoje.</p>
            <button class="menu-btn" onclick="iniciarQuiz('ambos')">
                <span class="menu-titulo">Ambos os dias</span>
                <span class="menu-desc">Geral</span>
            </button>
            <button class="menu-btn" onclick="iniciarQuiz('dia1')">
                <span class="menu-titulo">1º dia</span>
                <span class="menu-desc">Linguagens e Ciências Humanas</span>
            </button>
            <button class="menu-btn" onclick="iniciarQuiz('dia2')">
                <span class="menu-titulo">2º dia</span>
                <span class="menu-desc">Matemática e Ciências da Natureza</span>
            </button>

            <div class="menu-config">
                <label class="toggle-ia">
                    <input type="checkbox" id="toggle-ia" role="switch" checked>
                    <span class="toggle-trilho" aria-hidden="true"></span>
                    <span class="toggle-texto">
                        <span class="toggle-titulo">Assistência de IA</span>
                        <span class="toggle-desc">Cria uma questão de aquecimento antes de cada questão do ENEM. Desligada, você vai direto para a questão.</span>
                    </span>
                </label>
            </div>
        </div>

        <!-- TELA DO QUIZ (fica escondida até você escolher uma opção) -->
        <div id="quiz-screen" style="display: none;">
            <header class="quiz-header">
                <h1>Quiz ENEM</h1>
                <div class="quiz-header-acoes">
                    <button type="button" id="btn-ia" class="btn-texto">Desligar IA</button>
                    <button type="button" id="btn-voltar" class="btn-texto" onclick="voltarAoMenu()">Menu</button>
                </div>
            </header>

            <div id="question-container">
                <div id="question">Carregando...</div>
                <ul id="answer-buttons" class="answer-buttons"></ul>

                <!-- FERRAMENTAS: rascunho (desenho) e calculadora -->
                <div id="tools">
                    <div class="tools-tabs" role="tablist" aria-label="Ferramentas de apoio">
                        <button type="button" id="tab-rascunho" class="tool-tab" role="tab" aria-selected="true" aria-controls="scratchpad-container">Rascunho</button>
                        <button type="button" id="tab-calculadora" class="tool-tab" role="tab" aria-selected="false" aria-controls="calculadora" tabindex="-1">Calculadora</button>
                    </div>

                    <div id="scratchpad-container" role="tabpanel" aria-labelledby="tab-rascunho">
                        <div class="rascunho-topo">
                            <p class="rascunho-label">Rascunho para cálculos</p>
                            <button id="clear-canvas" class="btn-texto">Limpar</button>
                        </div>
                        <canvas id="drawing-canvas" width="632" height="160"></canvas>
                    </div>

                    <div id="calculadora" class="calculadora" role="tabpanel" aria-labelledby="tab-calculadora" tabindex="-1" hidden>
                        <div class="calc-visor" aria-live="polite">
                            <div id="calc-historico" class="calc-historico"></div>
                            <div id="calc-resultado" class="calc-resultado">0</div>
                        </div>
                        <div class="calc-teclas">
                            <button type="button" class="calc-tecla calc-acao" data-tecla="C" aria-label="Limpar tudo">C</button>
                            <button type="button" class="calc-tecla calc-acao" data-tecla="(" aria-label="Abrir parênteses">(</button>
                            <button type="button" class="calc-tecla calc-acao" data-tecla=")" aria-label="Fechar parênteses">)</button>
                            <button type="button" class="calc-tecla calc-op" data-tecla="÷" aria-label="Dividir">÷</button>

                            <button type="button" class="calc-tecla" data-tecla="7">7</button>
                            <button type="button" class="calc-tecla" data-tecla="8">8</button>
                            <button type="button" class="calc-tecla" data-tecla="9">9</button>
                            <button type="button" class="calc-tecla calc-op" data-tecla="×" aria-label="Multiplicar">×</button>

                            <button type="button" class="calc-tecla" data-tecla="4">4</button>
                            <button type="button" class="calc-tecla" data-tecla="5">5</button>
                            <button type="button" class="calc-tecla" data-tecla="6">6</button>
                            <button type="button" class="calc-tecla calc-op" data-tecla="−" aria-label="Subtrair">−</button>

                            <button type="button" class="calc-tecla" data-tecla="1">1</button>
                            <button type="button" class="calc-tecla" data-tecla="2">2</button>
                            <button type="button" class="calc-tecla" data-tecla="3">3</button>
                            <button type="button" class="calc-tecla calc-op" data-tecla="+" aria-label="Somar">+</button>

                            <button type="button" class="calc-tecla" data-tecla="0">0</button>
                            <button type="button" class="calc-tecla" data-tecla="," aria-label="Vírgula">,</button>
                            <button type="button" class="calc-tecla calc-acao" data-tecla="apagar" aria-label="Apagar último dígito">←</button>
                            <button type="button" class="calc-tecla calc-igual" data-tecla="=" aria-label="Calcular">=</button>
                        </div>
                    </div>
                </div>
            </div>

            <p class="score">Streak de acertos: <span id="score">0</span></p>
        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
