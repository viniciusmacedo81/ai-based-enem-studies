<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ENEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <!-- MENU INICIAL (aparece primeiro) -->
        <div id="menu-container">
            <h1>Escolha seu treino</h1>
            <p class="subtitulo">Selecione o que você quer focar hoje.</p>
            <button class="menu-btn" onclick="iniciarQuiz('ambos')">
                <span class="menu-titulo">Ambos os dias</span>
                <span class="menu-desc">Geral</span>
            </button>
            <button class="menu-btn" onclick="iniciarQuiz('dia1')">
                <span class="menu-titulo">1º dia</span>
                <span class="menu-desc">Linguagens e Ciências Humanas</span>
            </button>
            <button class="menu-btn" onclick="iniciarQuiz('dia2')">
                <span class="menu-titulo">2º dia</span>
                <span class="menu-desc">Matemática e Ciências da Natureza</span>
            </button>
        </div>

        <!-- TELA DO QUIZ (fica escondida até você escolher uma opção) -->
        <div id="quiz-screen" style="display: none;">
            <header class="quiz-header">
                <h1>Quiz ENEM</h1>
                <button id="btn-voltar" class="btn-texto" onclick="voltarAoMenu()">Menu</button>
            </header>

            <div id="question-container">
                <div id="question">Carregando...</div>
                <ul id="answer-buttons" class="answer-buttons"></ul>

                <div id="scratchpad-container">
                    <div class="rascunho-topo">
                        <p class="rascunho-label">Rascunho para cálculos</p>
                        <button id="clear-canvas" class="btn-texto">Limpar</button>
                    </div>
                    <canvas id="drawing-canvas" width="632" height="160"></canvas>
                </div>
            </div>

            <p class="score">Streak de acertos: <span id="score">0</span></p>
        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
